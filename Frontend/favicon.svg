<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9644;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF9644" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Abstract B / Bookmark shape -->
  <!-- Vertical spine -->
  <path d="M25 15 L25 85 L50 70 L75 85 L75 50 Q75 15 25 15 Z" fill="url(#mainGrad)" filter="url(#glow)" stroke="none" />
  
  <!-- Inner Detail to make it look like a folded ribbon or link -->
  <path d="M25 50 L75 50" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
</svg>